<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 射击游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff88;
            font-size: 18px;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
            pointer-events: none;
        }
        #score { font-size: 28px; font-weight: bold; }
        #ammo { color: #ffaa00; text-shadow: 0 0 10px #ffaa00; }
        #health { color: #ff3333; text-shadow: 0 0 10px #ff3333; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.95);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            display: none;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        /* 武器选择 HUD */
        #weapon-hud {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 10, 20, 0.9);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 15px 20px;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            min-width: 180px;
        }
        .weapon-slot {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 5px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .weapon-slot.active {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
        }
        .weapon-slot:hover {
            background: rgba(0, 255, 136, 0.1);
        }
        .weapon-slot-number {
            color: #888;
            font-size: 14px;
            font-weight: bold;
            min-width: 20px;
        }
        .weapon-slot.active .weapon-slot-number {
            color: #00ff88;
            text-shadow: 0 0 8px #00ff88;
        }
        .weapon-slot-name {
            color: #fff;
            font-size: 14px;
            flex: 1;
        }
        .weapon-slot.active .weapon-slot-name {
            color: #00ff88;
        }
        .weapon-slot-ammo {
            color: #ffaa00;
            font-size: 12px;
            font-family: monospace;
        }
        .weapon-slot.active .weapon-slot-ammo {
            color: #ffff00;
            text-shadow: 0 0 8px #ffaa00;
        }
        #game-over h1 {
            color: #00ff88;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ff88;
        }
        #final-score {
            color: #fff;
            font-size: 32px;
            margin-bottom: 20px;
        }
        #restart-btn {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border: none;
            color: #000;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00ff88;
        }
        #target-count {
            color: #ffaa00;
        }
        /* 换弹进度条 */
        #reload-bar-container {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff88;
            border-radius: 6px;
            overflow: hidden;
            display: none;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        #reload-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            transition: width 0.05s linear;
            box-shadow: 0 0 10px #00ff88 inset;
        }
        #reload-text {
            position: absolute;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff88;
            display: none;
            pointer-events: none;
        }
        /* 冲刺指示器 */
        #sprint-indicator {
            position: absolute;
            bottom: 80px;
            right: 30px;
            color: #00ff88;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff88;
            pointer-events: none;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        #sprint-indicator.active {
            opacity: 1;
            color: #ffff00;
            text-shadow: 0 0 15px #ffff00;
        }
        /* 散布指示器 */
        #spread-indicator {
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 12px;
            text-shadow: 0 0 8px #00ff88;
            pointer-events: none;
            opacity: 0.8;
            white-space: nowrap;
        }

        /* 难度选择菜单 */
        #difficulty-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.98);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            pointer-events: auto;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.4);
            z-index: 100;
            min-width: 400px;
        }
        #difficulty-menu h1 {
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #00ff88;
            font-size: 36px;
        }
        #difficulty-desc {
            color: #888;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .difficulty-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .difficulty-btn {
            background: rgba(20, 20, 40, 0.9);
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            color: #fff;
            width: 100%;
        }
        .difficulty-btn:hover {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .difficulty-btn:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        .diff-name {
            display: block;
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 5px;
        }
        .diff-detail {
            display: block;
            font-size: 14px;
            color: #aaa;
        }
        .difficulty-btn[data-difficulty="easy"] .diff-name { color: #00ff88; }
        .difficulty-btn[data-difficulty="normal"] .diff-name { color: #00ccff; }
        .difficulty-btn[data-difficulty="hard"] .diff-name { color: #ffaa00; }
        .difficulty-btn[data-difficulty="expert"] .diff-name { color: #ff3333; }
        .difficulty-btn[data-difficulty="easy"]:hover { border-color: #00ff88; }
        .difficulty-btn[data-difficulty="normal"]:hover { border-color: #00ccff; }
        .difficulty-btn[data-difficulty="hard"]:hover { border-color: #ffaa00; }
        .difficulty-btn[data-difficulty="expert"]:hover { border-color: #ff3333; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div id="hud">
                <div id="score">分数: <span id="score-value">0</span></div>
                <div id="ammo">弹药: <span id="ammo-value">30</span> / <span id="max-ammo">30</span></div>
                <div id="health">生命: <span id="health-value">100</span></div>
                <div id="target-count">剩余靶子: <span id="targets-left">10</span></div>
            </div>
            <canvas id="crosshair" width="128" height="128"></canvas>
            <div id="instructions">
                WASD 移动 | 鼠标瞄准 | 左键射击 | R 换弹 | Shift 切换冲刺 | 1-4/滚轮 切换武器 | ESC 暂停
            </div>
            <div id="spread-indicator">散布: 精准</div>
            <div id="reload-bar-container">
                <div id="reload-bar"></div>
            </div>
            <div id="reload-text">装填中...</div>
            <div id="sprint-indicator">冲刺: 关</div>
            <div id="weapon-hud"></div>
            <div id="game-over">
                <h1>游戏结束</h1>
                <div id="final-score">最终分数: <span id="final-score-value">0</span></div>
                <button id="restart-btn">重新开始</button>
            </div>
            <!-- 难度选择菜单 -->
            <div id="difficulty-menu">
                <h1>选择难度</h1>
                <p id="difficulty-desc">选择游戏难度，影响靶子血量、速度和数量</p>
                <div class="difficulty-options">
                    <button class="difficulty-btn" data-difficulty="easy">
                        <span class="diff-name">简单</span>
                        <span class="diff-detail">血量: 2 | 速度: 慢 | 靶子: 8 | 分数: 0.8x</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="normal">
                        <span class="diff-name">普通</span>
                        <span class="diff-detail">血量: 3 | 速度: 正常 | 靶子: 10 | 分数: 1.0x</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="hard">
                        <span class="diff-name">困难</span>
                        <span class="diff-detail">血量: 5 | 速度: 快 | 靶子: 12 | 分数: 1.5x</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="expert">
                        <span class="diff-name">专家</span>
                        <span class="diff-detail">血量: 8 | 速度: 极快 | 靶子: 15 | 分数: 2.0x</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // 游戏状态
        const gameState = {
            score: 0,
            health: 100,
            maxHealth: 100,
            targetsLeft: 10,
            isGameOver: false,
            isPaused: false,
            lastShot: 0,
            isReloading: false,
            reloadStartTime: 0,
            moveSpeed: 0.14,  // 降低基础速度
            sprintMultiplier: 1.8,  // 降低冲刺倍率
            isSprinting: false,
            isADS: false,           // 开镜状态
            adsFOV: 40,             // 开镜FOV
            normalFOV: 75,          // 正常FOV
            currentFOV: 75,         // 当前FOV（用于插值）
            isFiring: false,        // 连射状态
            difficulty: 'normal',   // 难度: easy, normal, hard, expert
            difficultySettings: {   // 难度配置
                easy: { targetHealth: 2, speedMin: 0.3, speedMax: 1.0, targetCount: 8, scoreMultiplier: 0.8 },
                normal: { targetHealth: 3, speedMin: 0.5, speedMax: 2.0, targetCount: 10, scoreMultiplier: 1.0 },
                hard: { targetHealth: 5, speedMin: 0.8, speedMax: 3.0, targetCount: 12, scoreMultiplier: 1.5 },
                expert: { targetHealth: 8, speedMin: 1.2, speedMax: 4.0, targetCount: 15, scoreMultiplier: 2.0 }
            },
            showDifficultyMenu: true // 是否显示难度选择菜单
        };

        // 准星散布状态
        const crosshairState = {
            baseSpread: 4,      // 静止时基础散布
            moveSpread: 18,     // 移动时散布
            sprintSpread: 32,   // 冲刺时散布
            currentSpread: 4,   // 当前散布
            targetSpread: 4,    // 目标散布
            lerpSpeed: 12       // 插值速度
        };

        // 武器定义
        const WEAPONS = [
            {
                id: 'rifle',
                name: '突击步枪',
                spread: { base: 4, move: 18, sprint: 32 },
                adsSpread: 1.5,
                damageMultiplier: 1.0,
                fireRate: 120,
                maxAmmo: 30,
                reloadTime: 2000,
                recoil: { x: 0.02, y: 0.03 },
                color: '#00ff88'
            },
            {
                id: 'smg',
                name: '冲锋枪',
                spread: { base: 3, move: 12, sprint: 25 },
                adsSpread: 2,
                damageMultiplier: 0.5,
                fireRate: 50,
                maxAmmo: 50,
                reloadTime: 1500,
                recoil: { x: 0.015, y: 0.02 },
                color: '#0088ff'
            },
            {
                id: 'sniper',
                name: '狙击枪',
                spread: { base: 20, move: 35, sprint: 50 },
                adsSpread: 0,
                damageMultiplier: 4.5,
                fireRate: 1200,
                maxAmmo: 5,
                reloadTime: 3000,
                recoil: { x: 0.04, y: 0.06 },
                color: '#ff0066'
            },
            {
                id: 'shotgun',
                name: '霰弹枪',
                spread: { base: 15, move: 35, sprint: 50 },
                adsSpread: 10,
                damageMultiplier: 0.35,
                fireRate: 800,
                maxAmmo: 8,
                reloadTime: 2500,
                recoil: { x: 0.03, y: 0.05 },
                color: '#ffaa00',
                pellets: 8,
                pelletSpread: 8
            }
        ];

        // 武器状态
        let currentWeaponIndex = 0;
        let currentWeapon = WEAPONS[0];
        let weaponAmmo = WEAPONS.map(w => w.maxAmmo); // 每个武器独立弹药

        // 按键状态
        const keys = {
            w: false, a: false, s: false, d: false,
            shift: false, r: false
        };

        // 移动状态
        let isMoving = false;
        let moveVelocity = new THREE.Vector3();

        // Three.js 核心对象
        let scene, camera, renderer, controls;
        let player, playerBody;
        let targets = [];
        let bullets = [];
        let particles = [];
        let obstacles = [];
        let bulletDecals = []; // 持久弹孔贴花
        let muzzleFlash = null;
        let muzzleFlashes = []; // 所有武器的口焰
        let weaponGroups = [];  // 所有武器模型组
        let clock = new THREE.Clock();
        let raycaster = new THREE.Raycaster();

        // 准星 Canvas
        const crosshairCanvas = document.getElementById('crosshair');
        const crosshairCtx = crosshairCanvas.getContext('2d');
        const crosshairSize = 128;
        const center = crosshairSize / 2;

        // 初始化游戏
        async function init() {
            await setupScene();
            setupPlayer();
            setupEnvironment();
            setupLights();
            setupEventListeners();

            // 显示难度选择菜单
            showDifficultyMenu();

            animate();
        }

        function showDifficultyMenu() {
            const menu = document.getElementById('difficulty-menu');
            menu.style.display = 'block';
            gameState.showDifficultyMenu = true;

            // 添加难度按钮点击事件
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectDifficulty(btn.dataset.difficulty);
                });
            });
        }

        function selectDifficulty(difficulty) {
            gameState.difficulty = difficulty;
            gameState.showDifficultyMenu = false;

            const menu = document.getElementById('difficulty-menu');
            menu.style.display = 'none';

            // 初始化靶子和开始游戏
            setupTargets();
            controls.lock();
        }

        // 场景设置
        async function setupScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 30, 150);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.5;
            document.getElementById('game-container').appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);

            controls.addEventListener('lock', () => {
                gameState.isPaused = false;
            });
            controls.addEventListener('unlock', () => {
                if (!gameState.isGameOver) gameState.isPaused = true;
            });

            renderer.domElement.addEventListener('click', () => {
                if (!gameState.isGameOver) controls.lock();
            });

            window.addEventListener('resize', onWindowResize);
        }

        // 玩家设置
        function setupPlayer() {
            const bodyGeometry = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
            const bodyMaterial = new THREE.MeshBasicMaterial({ visible: false });
            playerBody = new THREE.Mesh(bodyGeometry, bodyMaterial);
            playerBody.position.set(0, 1.6, 0);
            scene.add(playerBody);

            // 创建所有武器模型
            createWeaponModels();

            camera.add(weaponGroups[currentWeaponIndex]);
            player = camera;

            updateWeaponHUD();
        }

        // 创建所有武器模型
        function createWeaponModels() {
            weaponGroups = [];
            muzzleFlashes = [];

            WEAPONS.forEach((weapon, index) => {
                const gunGroup = new THREE.Group();
                gunGroup.visible = (index === currentWeaponIndex);

                // 枪身颜色根据武器类型
                const gunColors = {
                    rifle: 0x1a1a2e,
                    smg: 0x0d1a2e,
                    sniper: 0x1a0d1a,
                    shotgun: 0x1a1a0d
                };

                const gunBodyGeo = new THREE.BoxGeometry(0.08, 0.12, 0.5);
                const gunBodyMat = new THREE.MeshStandardMaterial({
                    color: gunColors[weapon.id] || 0x1a1a2e,
                    metalness: 0.8,
                    roughness: 0.2
                });
                const gunBody = new THREE.Mesh(gunBodyGeo, gunBodyMat);
                gunBody.position.set(0.25, -0.15, -0.5);
                gunGroup.add(gunBody);

                // 枪管 - 不同武器不同长度
                const barrelLengths = { rifle: 0.4, smg: 0.25, sniper: 0.6, shotgun: 0.35 };
                const barrelRadius = { rifle: 0.03, smg: 0.025, sniper: 0.035, shotgun: 0.04 };
                const barrelGeo = new THREE.CylinderGeometry(
                    barrelRadius[weapon.id] || 0.03,
                    barrelRadius[weapon.id] || 0.03,
                    barrelLengths[weapon.id] || 0.4,
                    8
                );
                const barrelMat = new THREE.MeshStandardMaterial({
                    color: 0x0d0d1a,
                    metalness: 0.9,
                    roughness: 0.1
                });
                const barrel = new THREE.Mesh(barrelGeo, barrelMat);
                barrel.rotation.x = Math.PI / 2;
                barrel.position.set(0.25, -0.15, -0.5 - (barrelLengths[weapon.id] || 0.4) / 2 - 0.1);
                gunGroup.add(barrel);

                // 准星
                const sightGeo = new THREE.BoxGeometry(0.015, 0.04, 0.08);
                const sightColor = parseInt(weapon.color.replace('#', '0x'));
                const sightMat = new THREE.MeshStandardMaterial({
                    color: sightColor,
                    emissive: sightColor,
                    emissiveIntensity: 1
                });
                const sight = new THREE.Mesh(sightGeo, sightMat);
                sight.position.set(0.25, 0.02, -0.6);
                gunGroup.add(sight);

                // 口焰
                const flashGeo = new THREE.PlaneGeometry(0.3, 0.3);
                const flashMat = new THREE.MeshBasicMaterial({
                    color: 0xffff00,
                    transparent: true,
                    opacity: 0,
                    side: THREE.DoubleSide
                });
                const muzzleFlashMesh = new THREE.Mesh(flashGeo, flashMat);
                muzzleFlashMesh.position.set(0.25, -0.15, -0.5 - (barrelLengths[weapon.id] || 0.4) - 0.1);
                muzzleFlashMesh.rotation.x = Math.PI / 2;
                gunGroup.add(muzzleFlashMesh);
                muzzleFlashes.push(muzzleFlashMesh);

                weaponGroups.push(gunGroup);
            });

            muzzleFlash = muzzleFlashes[currentWeaponIndex];
        }

        // 切换武器
        function switchWeapon(index) {
            if (index < 0 || index >= WEAPONS.length || index === currentWeaponIndex) return;

            // 切换武器时退出开镜
            if (gameState.isADS) {
                gameState.isADS = false;
            }

            // 隐藏当前武器
            weaponGroups[currentWeaponIndex].visible = false;

            // 显示新武器
            currentWeaponIndex = index;
            currentWeapon = WEAPONS[currentWeaponIndex];
            weaponGroups[currentWeaponIndex].visible = true;
            muzzleFlash = muzzleFlashes[currentWeaponIndex];

            // 更新游戏状态使用新武器的参数
            gameState.fireRate = currentWeapon.fireRate;
            gameState.reloadTime = currentWeapon.reloadTime;
            gameState.maxAmmo = currentWeapon.maxAmmo;
            gameState.ammo = weaponAmmo[currentWeaponIndex];

            // 重置散布
            crosshairState.baseSpread = currentWeapon.spread.base;
            crosshairState.moveSpread = currentWeapon.spread.move;
            crosshairState.sprintSpread = currentWeapon.spread.sprint;
            crosshairState.targetSpread = currentWeapon.spread.base;

            updateWeaponHUD();
            updateAmmoUI();
        }

        // 更新武器 HUD
        function updateWeaponHUD() {
            const hud = document.getElementById('weapon-hud');
            hud.innerHTML = '';

            WEAPONS.forEach((weapon, index) => {
                const slot = document.createElement('div');
                slot.className = 'weapon-slot' + (index === currentWeaponIndex ? ' active' : '');
                slot.innerHTML = `
                    <span class="weapon-slot-number">${index + 1}</span>
                    <span class="weapon-slot-name">${weapon.name}</span>
                    <span class="weapon-slot-ammo">${weaponAmmo[index]} / ${weapon.maxAmmo}</span>
                `;
                hud.appendChild(slot);
            });
        }

        // 环境设置
        function setupEnvironment() {
            const groundGeo = new THREE.PlaneGeometry(200, 200, 50, 50);
            const groundMat = new THREE.MeshStandardMaterial({
                color: 0x2a2a4a,
                roughness: 0.8,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const gridHelper = new THREE.GridHelper(200, 100, 0x00ff88, 0x004433);
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            createWalls();
            createObstacles();
            createAmbientParticles();
        }

        function createWalls() {
            const wallMat = new THREE.MeshStandardMaterial({
                color: 0x2a2a5e,
                roughness: 0.7,
                metalness: 0.3
            });

            const walls = [
                { pos: [0, 5, -50], scale: [100, 10, 1] },
                { pos: [0, 5, 50], scale: [100, 10, 1] },
                { pos: [-50, 5, 0], scale: [1, 10, 100] },
                { pos: [50, 5, 0], scale: [1, 10, 100] }
            ];

            walls.forEach(w => {
                const geo = new THREE.BoxGeometry(...w.scale);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(...w.pos);
                mesh.receiveShadow = true;
                mesh.castShadow = true;
                scene.add(mesh);
                obstacles.push(mesh);
            });
        }

        function createObstacles() {
            const obstacleMat = new THREE.MeshStandardMaterial({
                color: 0x3a3a6e,
                roughness: 0.6,
                metalness: 0.4
            });

            for (let i = 0; i < 20; i++) {
                const type = Math.random();
                let geo, mesh;

                if (type < 0.4) {
                    geo = new THREE.BoxGeometry(
                        2 + Math.random() * 3,
                        2 + Math.random() * 3,
                        2 + Math.random() * 3
                    );
                } else if (type < 0.7) {
                    geo = new THREE.CylinderGeometry(
                        0.5 + Math.random() * 1,
                        0.5 + Math.random() * 1,
                        3 + Math.random() * 4,
                        8
                    );
                } else {
                    geo = new THREE.BoxGeometry(
                        1 + Math.random() * 1.5,
                        4 + Math.random() * 6,
                        1 + Math.random() * 1.5
                    );
                }

                mesh = new THREE.Mesh(geo, obstacleMat);
                mesh.position.set(
                    (Math.random() - 0.5) * 80,
                    geo.parameters.height / 2 || 1,
                    (Math.random() - 0.5) * 80
                );
                mesh.rotation.y = Math.random() * Math.PI;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                obstacles.push(mesh);
            }
        }

        function createAmbientParticles() {
            const particleCount = 500;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const alphas = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 120;
                positions[i * 3 + 1] = Math.random() * 20;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 120;
                sizes[i] = Math.random() * 0.1 + 0.02;
                alphas[i] = Math.random() * 0.5 + 0.1;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geo.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));

            const mat = new THREE.PointsMaterial({
                color: 0x00ff88,
                size: 0.1,
                transparent: true,
                opacity: 0.6,
                vertexColors: false,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);
            particles.push({ mesh: points, type: 'ambient' });
        }

        // 靶子设置 - 人形
        function setupTargets() {
            const diffSettings = gameState.difficultySettings[gameState.difficulty] || gameState.difficultySettings.normal;
            const targetCount = diffSettings.targetCount;
            for (let i = 0; i < targetCount; i++) {
                createTarget();
            }
            updateTargetCount();
        }

        function createTarget() {
            const targetGroup = new THREE.Group();
            targetGroup.userData = {
                moveData: null,
                health: 3,
                maxHealth: 3,
                isTarget: true,
                hitFlash: 0,
                hitBoxes: []
            };

            // 创建人形
            const human = createHumanMesh();
            targetGroup.add(human);

            // 获取当前难度设置
            const diffSettings = gameState.difficultySettings[gameState.difficulty] || gameState.difficultySettings.normal;
            const targetHealth = diffSettings.targetHealth;
            const speedMin = diffSettings.speedMin;
            const speedMax = diffSettings.speedMax;

            // 运动参数 - 修复Y坐标使脚底接触地面
            const moveType = Math.floor(Math.random() * 3);
            const moveData = {
                type: moveType,
                center: new THREE.Vector3(
                    (Math.random() - 0.5) * 60,
                    0.54,  // 调整Y坐标使角色站在地面上
                    (Math.random() - 0.5) * 60
                ),
                radius: 5 + Math.random() * 10,
                speed: speedMin + Math.random() * (speedMax - speedMin),
                angle: Math.random() * Math.PI * 2,
                verticalSpeed: 0.5 + Math.random() * 1,
                verticalRange: 1 + Math.random() * 2,
                verticalPhase: Math.random() * Math.PI * 2,
                originalY: 0.54  // 保持原始Y参考
            };

            targetGroup.position.copy(moveData.center);
            targetGroup.userData.moveData = moveData;
            targetGroup.userData.health = targetHealth;
            targetGroup.userData.maxHealth = targetHealth;

            // 创建碰撞盒（用于射线检测）
            createHitBoxes(targetGroup, human);

            scene.add(targetGroup);
            targets.push(targetGroup);
        }

        function createHumanMesh() {
            const humanGroup = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0xcc8866,
                roughness: 0.7,
                metalness: 0.1
            });
            const clothMat = new THREE.MeshStandardMaterial({
                color: 0x224488,
                roughness: 0.9,
                metalness: 0.05
            });
            const darkClothMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                roughness: 0.8,
                metalness: 0.1
            });

            // 头部
            const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.y = 1.7;
            head.castShadow = true;
            humanGroup.add(head);

            // 头盔/帽子
            const hatGeo = new THREE.CylinderGeometry(0.26, 0.28, 0.15, 16);
            const hat = new THREE.Mesh(hatGeo, darkClothMat);
            hat.position.y = 1.9;
            hat.castShadow = true;
            humanGroup.add(hat);

            // 躯干
            const torsoGeo = new THREE.CapsuleGeometry(0.35, 0.6, 4, 8);
            const torso = new THREE.Mesh(torsoGeo, clothMat);
            torso.position.y = 1.15;
            torso.castShadow = true;
            humanGroup.add(torso);

            // 左臂上
            const upperArmGeo = new THREE.CapsuleGeometry(0.1, 0.35, 4, 8);
            const leftUpperArm = new THREE.Mesh(upperArmGeo, clothMat);
            leftUpperArm.position.set(-0.5, 1.3, 0);
            leftUpperArm.rotation.z = 0.3;
            leftUpperArm.castShadow = true;
            humanGroup.add(leftUpperArm);

            // 左臂下
            const leftLowerArm = new THREE.Mesh(upperArmGeo, bodyMat);
            leftLowerArm.position.set(-0.8, 1.0, 0);
            leftLowerArm.rotation.z = 0.5;
            leftLowerArm.castShadow = true;
            humanGroup.add(leftLowerArm);

            // 右臂上
            const rightUpperArm = new THREE.Mesh(upperArmGeo, clothMat);
            rightUpperArm.position.set(0.5, 1.3, 0);
            rightUpperArm.rotation.z = -0.3;
            rightUpperArm.castShadow = true;
            humanGroup.add(rightUpperArm);

            // 右臂下（持枪姿势）
            const rightLowerArm = new THREE.Mesh(upperArmGeo, bodyMat);
            rightLowerArm.position.set(0.75, 1.0, 0.2);
            rightLowerArm.rotation.z = -0.5;
            rightLowerArm.rotation.x = -0.3;
            rightLowerArm.castShadow = true;
            humanGroup.add(rightLowerArm);

            // 左腿
            const legGeo = new THREE.CapsuleGeometry(0.14, 0.5, 4, 8);
            const leftLeg = new THREE.Mesh(legGeo, darkClothMat);
            leftLeg.position.set(-0.18, 0.45, 0);
            leftLeg.castShadow = true;
            humanGroup.add(leftLeg);

            // 右腿
            const rightLeg = new THREE.Mesh(legGeo, darkClothMat);
            rightLeg.position.set(0.18, 0.45, 0);
            rightLeg.castShadow = true;
            humanGroup.add(rightLeg);

            // 存储身体部件引用用于碰撞检测
            humanGroup.userData.bodyParts = {
                head: head,
                torso: torso,
                leftUpperArm: leftUpperArm,
                leftLowerArm: leftLowerArm,
                rightUpperArm: rightUpperArm,
                rightLowerArm: rightLowerArm,
                leftLeg: leftLeg,
                rightLeg: rightLeg
            };

            return humanGroup;
        }

        function createHitBoxes(targetGroup, humanGroup) {
            const parts = humanGroup.userData.bodyParts;
            const hitBoxes = [];

            // 头部碰撞盒 - 高分区
            const headBox = new THREE.Box3().setFromObject(parts.head);
            hitBoxes.push({ box: headBox, part: 'head', multiplier: 3.0, mesh: parts.head });

            // 躯干碰撞盒 - 中分区
            const torsoBox = new THREE.Box3().setFromObject(parts.torso);
            hitBoxes.push({ box: torsoBox, part: 'torso', multiplier: 1.0, mesh: parts.torso });

            // 四肢 - 低分区
            const limbParts = ['leftUpperArm', 'leftLowerArm', 'rightUpperArm', 'rightLowerArm', 'leftLeg', 'rightLeg'];
            limbParts.forEach(partName => {
                const box = new THREE.Box3().setFromObject(parts[partName]);
                hitBoxes.push({ box: box, part: partName, multiplier: 0.5, mesh: parts[partName] });
            });

            targetGroup.userData.hitBoxes = hitBoxes;
        }

        function updateHitBoxes(targetGroup) {
            const hitBoxes = targetGroup.userData.hitBoxes;
            hitBoxes.forEach(hb => {
                hb.box.setFromObject(hb.mesh);
            });
        }

        // 墙体弹孔效果（持久化3秒）
        function createWallDecal(position, normal) {
            // 创建一个小的圆形贴花表示弹孔
            const decalSize = 0.15 + Math.random() * 0.1; // 随机大小
            const decalGeo = new THREE.RingGeometry(decalSize * 0.8, decalSize, 8);

            // 使用深灰色/黑色表示弹孔
            const decalMat = new THREE.MeshBasicMaterial({
                color: 0x111111,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.9
            });

            const decal = new THREE.Mesh(decalGeo, decalMat);

            // 定位弹孔在墙面上
            decal.position.copy(position);
            if (normal) {
                // 使弹孔面向墙面法线
                decal.lookAt(position.clone().add(normal));
                // 稍微偏移以避免Z fighting
                decal.position.addScaledVector(normal, 0.001);
            }

            // 设置随机旋转
            decal.rotation.z = Math.random() * Math.PI * 2;

            scene.add(decal);

            // 添加到弹孔列表，3秒后移除
            bulletDecals.push({
                mesh: decal,
                createdTime: Date.now(),
                lifetime: 3000 // 3秒
            });
        }

        // 墙体冲击粒子效果（短暂）
        function createWallImpact(position, normal) {
            // 创建一个短暂的粒子效果模拟弹孔冲击
            const count = 12;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = position.x;
                positions[i * 3 + 1] = position.y;
                positions[i * 3 + 2] = position.z;

                // 沿着法线方向随机散射
                const dir = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.8 + (normal ? normal.x : 0) * 0.4,
                    Math.random() * 0.8 + (normal ? normal.y : 0) * 0.4,
                    (Math.random() - 0.5) * 0.8 + (normal ? normal.z : 0) * 0.4
                ).normalize().multiplyScalar(0.15 + Math.random() * 0.25);
                velocities.push(dir);

                // 弹孔冲击颜色：灰白色带火星
                const r = 0.7 + Math.random() * 0.3;
                const g = 0.6 + Math.random() * 0.4;
                const b = 0.4 + Math.random() * 0.4;
                colors[i * 3] = r;
                colors[i * 3 + 1] = g;
                colors[i * 3 + 2] = b;
                sizes[i] = Math.random() * 0.12 + 0.06;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.12,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);

            particles.push({
                mesh: points,
                type: 'wallImpact',
                velocities,
                life: 0.6,
                decay: 0.02
            });
        }
