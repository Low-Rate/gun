        // 事件监听
        function setupEventListeners() {
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key in keys) keys[key] = true;

                if (key === 'shift' && !gameState.isReloading) {
                    gameState.isSprinting = !gameState.isSprinting;
                    updateSprintIndicator();
                }

                if (key === 'r' && !gameState.isReloading && gameState.ammo < gameState.maxAmmo) {
                    reload();
                }

                // 武器切换 1-4
                if (['1', '2', '3', '4'].includes(key) && !gameState.isReloading) {
                    const weaponIndex = parseInt(key) - 1;
                    if (weaponIndex < WEAPONS.length) {
                        switchWeapon(weaponIndex);
                    }
                }

                if (key === 'escape') {
                    if (controls.isLocked) controls.unlock();
                }
            });

            document.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key in keys) keys[key] = false;
            });

            // 鼠标滚轮切换武器
            document.addEventListener('wheel', (e) => {
                if (!controls.isLocked || gameState.isReloading) return;
                e.preventDefault();
                const newIndex = currentWeaponIndex + (e.deltaY > 0 ? 1 : -1);
                const wrappedIndex = (newIndex + WEAPONS.length) % WEAPONS.length;
                switchWeapon(wrappedIndex);
            }, { passive: false });

            document.addEventListener('mousedown', (e) => {
                if (e.button === 0 && controls.isLocked && !gameState.isGameOver) {
                    // 步枪和冲锋枪支持连发
                    if (currentWeapon.id === 'rifle' || currentWeapon.id === 'smg') {
                        gameState.isFiring = true;
                    } else {
                        shoot();
                    }
                }
                // 右键开镜
                if (e.button === 2 && controls.isLocked && !gameState.isGameOver && !gameState.isReloading) {
                    const weapon = currentWeapon;
                    // 只有当武器有adsSpread且adsSpread小于baseSpread时才允许开镜
                    if (weapon.adsSpread !== undefined && weapon.adsSpread < weapon.spread.base) {
                        gameState.isADS = !gameState.isADS;
                    }
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (e.button === 0) {
                    gameState.isFiring = false;
                }
            });

            document.getElementById('restart-btn').addEventListener('click', restartGame);
            document.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        function updateSprintIndicator() {
            const indicator = document.getElementById('sprint-indicator');
            if (gameState.isSprinting) {
                indicator.textContent = '冲刺: 开';
                indicator.classList.add('active');
            } else {
                indicator.textContent = '冲刺: 关';
                indicator.classList.remove('active');
            }
        }

        // 动态准星绘制
        function drawCrosshair(delta) {
            // 处理开镜FOV插值
            const targetFOV = gameState.isADS ? gameState.adsFOV : gameState.normalFOV;
            gameState.currentFOV += (targetFOV - gameState.currentFOV) * 15 * delta;
            camera.fov = gameState.currentFOV;
            camera.updateProjectionMatrix();

            // 确定目标散布 - 开镜时使用adsSpread
            let baseSpread = crosshairState.baseSpread;
            let moveSpread = crosshairState.moveSpread;
            let sprintSpread = crosshairState.sprintSpread;

            if (gameState.isADS && currentWeapon.adsSpread !== undefined) {
                baseSpread = currentWeapon.adsSpread;
                moveSpread = currentWeapon.adsSpread * 1.5;  // 开镜移动散布略大
                sprintSpread = currentWeapon.adsSpread * 2;  // 开镜冲刺散布更大
            }

            if (gameState.isSprinting) {
                crosshairState.targetSpread = sprintSpread;
            } else if (isMoving) {
                crosshairState.targetSpread = moveSpread;
            } else {
                crosshairState.targetSpread = baseSpread;
            }

            // 平滑插值
            crosshairState.currentSpread += (crosshairState.targetSpread - crosshairState.currentSpread) * crosshairState.lerpSpeed * delta;

            // 更新散布文字
            const spreadText = document.getElementById('spread-indicator');
            if (gameState.isADS) {
                spreadText.textContent = '开镜中...';
                spreadText.style.color = '#ff0066';
                spreadText.style.textShadow = '0 0 8px #ff0066';
            } else if (crosshairState.currentSpread < 8) {
                spreadText.textContent = '散布: 精准';
                spreadText.style.color = '#00ff88';
                spreadText.style.textShadow = '0 0 8px #00ff88';
            } else if (crosshairState.currentSpread < 22) {
                spreadText.textContent = '散布: 正常';
                spreadText.style.color = '#ffaa00';
                spreadText.style.textShadow = '0 0 8px #ffaa00';
            } else {
                spreadText.textContent = '散布: 较大';
                spreadText.style.color = '#ff4444';
                spreadText.style.textShadow = '0 0 8px #ff4444';
            }

            // 清空画布
            crosshairCtx.clearRect(0, 0, crosshairSize, crosshairSize);

            const spread = crosshairState.currentSpread;
            const gap = 6 + spread; // 中心间隙
            const length = 14; // 准星线长度
            const thickness = 2; // 线条粗细
            const outerLength = 8; // 外侧线段长度

            // 颜色设置
            const mainColor = '#00ff88';
            const glowColor = 'rgba(0, 255, 136, 0.6)';
            const outerColor = 'rgba(0, 255, 136, 0.4)';

            // 开镜时显示简单的准星（单点或简单十字）
            if (gameState.isADS && currentWeapon.id === 'sniper') {
                // 狙击镜准星：简单的十字线 + 中心点
                crosshairCtx.strokeStyle = '#ff0066';
                crosshairCtx.lineWidth = 1;
                crosshairCtx.shadowColor = '#ff0066';
                crosshairCtx.shadowBlur = 6;

                // 细十字线
                crosshairCtx.beginPath();
                crosshairCtx.moveTo(center, 0);
                crosshairCtx.lineTo(center, crosshairSize);
                crosshairCtx.moveTo(0, center);
                crosshairCtx.lineTo(crosshairSize, center);
                crosshairCtx.stroke();

                // 中心点
                crosshairCtx.fillStyle = '#ff0066';
                crosshairCtx.shadowBlur = 10;
                crosshairCtx.beginPath();
                crosshairCtx.arc(center, center, 2, 0, Math.PI * 2);
                crosshairCtx.fill();

                // 可选：添加测距标记
                crosshairCtx.strokeStyle = 'rgba(255, 0, 102, 0.3)';
                crosshairCtx.lineWidth = 0.5;
                crosshairCtx.setLineDash([10, 10]);
                crosshairCtx.beginPath();
                crosshairCtx.arc(center, center, 40, 0, Math.PI * 2);
                crosshairCtx.stroke();
                crosshairCtx.setLineDash([]);

            } else {
                // 普通准星
                crosshairCtx.lineWidth = thickness;
                crosshairCtx.lineCap = 'round';
                crosshairCtx.strokeStyle = mainColor;
                crosshairCtx.shadowColor = '#00ff88';
                crosshairCtx.shadowBlur = 8;

                // 四个方向的主准星线
                // 上
                crosshairCtx.beginPath();
                crosshairCtx.moveTo(center, center - gap);
                crosshairCtx.lineTo(center, center - gap - length);
                crosshairCtx.stroke();

                // 下
                crosshairCtx.beginPath();
                crosshairCtx.moveTo(center, center + gap);
                crosshairCtx.lineTo(center, center + gap + length);
                crosshairCtx.stroke();

                // 左
                crosshairCtx.beginPath();
                crosshairCtx.moveTo(center - gap, center);
                crosshairCtx.lineTo(center - gap - length, center);
                crosshairCtx.stroke();

                // 右
                crosshairCtx.beginPath();
                crosshairCtx.moveTo(center + gap, center);
                crosshairCtx.lineTo(center + gap + length, center);
                crosshairCtx.stroke();

                // 外侧括号（表示散布范围）
                crosshairCtx.strokeStyle = outerColor;
                crosshairCtx.lineWidth = 1.5;
                crosshairCtx.shadowBlur = 4;

                const bracketOffset = gap + length + 4;
                const bracketSize = 6;

                // 左上括号
                crosshairCtx.beginPath();
                crosshairCtx.moveTo(center - bracketOffset, center - bracketOffset - bracketSize);
                crosshairCtx.lineTo(center - bracketOffset, center - bracketOffset);
                crosshairCtx.lineTo(center - bracketOffset + bracketSize, center - bracketOffset);
                crosshairCtx.stroke();

                // 右上括号
                crosshairCtx.beginPath();
                crosshairCtx.moveTo(center + bracketOffset + bracketSize, center - bracketOffset);
                crosshairCtx.lineTo(center + bracketOffset, center - bracketOffset);
                crosshairCtx.lineTo(center + bracketOffset, center - bracketOffset - bracketSize);
                crosshairCtx.stroke();

                // 左下括号
                crosshairCtx.beginPath();
                crosshairCtx.moveTo(center - bracketOffset, center + bracketOffset + bracketSize);
                crosshairCtx.lineTo(center - bracketOffset, center + bracketOffset);
                crosshairCtx.lineTo(center - bracketOffset + bracketSize, center + bracketOffset);
                crosshairCtx.stroke();

                // 右下括号
                crosshairCtx.beginPath();
                crosshairCtx.moveTo(center + bracketOffset + bracketSize, center + bracketOffset);
                crosshairCtx.lineTo(center + bracketOffset, center + bracketOffset);
                crosshairCtx.lineTo(center + bracketOffset, center + bracketOffset + bracketSize);
                crosshairCtx.stroke();

                // 中心点
                crosshairCtx.fillStyle = mainColor;
                crosshairCtx.shadowBlur = 10;
                crosshairCtx.beginPath();
                crosshairCtx.arc(center, center, 1.5, 0, Math.PI * 2);
                crosshairCtx.fill();

                // 撒布圆圈（可选：显示预估散布范围）
                if (spread > 10) {
                    crosshairCtx.strokeStyle = 'rgba(255, 100, 100, 0.3)';
                    crosshairCtx.lineWidth = 1;
                    crosshairCtx.shadowBlur = 0;
                    crosshairCtx.setLineDash([4, 4]);
                    crosshairCtx.beginPath();
                    crosshairCtx.arc(center, center, spread * 1.2, 0, Math.PI * 2);
                    crosshairCtx.stroke();
                    crosshairCtx.setLineDash([]);
                }
            }
        }

        // 射击逻辑 - 加入散布和墙体击中检测
        function shoot() {
            const now = Date.now();
            if (gameState.isReloading || now - gameState.lastShot < gameState.fireRate) return;
            if (gameState.ammo <= 0) {
                reload();
                return;
            }

            gameState.lastShot = now;
            gameState.ammo--;
            weaponAmmo[currentWeaponIndex] = gameState.ammo;
            updateAmmoUI();
            updateWeaponHUD();

            showMuzzleFlash();

            // 获取弹丸数量（霰弹枪多发，其他单发）
            const pelletCount = currentWeapon.pellets || 1;
            const isShotgun = currentWeapon.id === 'shotgun';
            const pelletConeSpread = currentWeapon.pelletSpread || 0; // 霰弹枪的锥形散布角度

            // 基础散布（来自准星状态）
            const baseSpreadRad = (crosshairState.currentSpread / 128) * (Math.PI / 180) * 4;
            // 霰弹枪额外锥形散布
            const pelletSpreadRad = (pelletConeSpread / 128) * (Math.PI / 180) * 4;

            const rayOrigin = camera.getWorldPosition(new THREE.Vector3());

            // 准备所有可击中的对象
            const targetMeshes = [];
            targets.forEach(t => {
                if (t.userData.hitBoxes) {
                    t.userData.hitBoxes.forEach(hb => targetMeshes.push(hb.mesh));
                }
            });
            const environmentMeshes = obstacles;
            const allMeshes = [...targetMeshes, ...environmentMeshes];

            // 记录是否有击中靶子（用于墙体效果）
            let anyTargetHit = false;
            let firstHitPoint = null;
            let firstHitNormal = null;

            // 为每个弹丸发射射线
            for (let p = 0; p < pelletCount; p++) {
                // 计算每个弹丸的散布
                let spreadX, spreadY;

                if (isShotgun) {
                    // 霰弹枪：基础散布 + 锥形额外散布
                    const totalSpreadRad = baseSpreadRad + pelletSpreadRad;
                    spreadX = (Math.random() - 0.5) * totalSpreadRad * 2;
                    spreadY = (Math.random() - 0.5) * totalSpreadRad * 2;
                } else if (gameState.isADS && currentWeapon.id === 'sniper') {
                    // 狙击枪开镜：零散布
                    spreadX = 0;
                    spreadY = 0;
                } else {
                    // 其他武器：使用准星散布
                    spreadX = (Math.random() - 0.5) * baseSpreadRad * 2;
                    spreadY = (Math.random() - 0.5) * baseSpreadRad * 2;
                }

                // 创建带散布的射线
                const tempMatrix = new THREE.Matrix4();
                tempMatrix.identity();
                tempMatrix.makeRotationFromEuler(new THREE.Euler(spreadY, spreadX, 0, 'YXZ'));

                const rayDir = new THREE.Vector3(0, 0, -1).applyMatrix4(tempMatrix).applyQuaternion(camera.quaternion).normalize();
                raycaster.set(rayOrigin, rayDir);

                const intersects = raycaster.intersectObjects(allMeshes, true);

                const endPoint = intersects.length > 0 ? intersects[0].point : rayOrigin.clone().add(rayDir.clone().multiplyScalar(100));

                // 为每个弹丸创建弹道轨迹（霰弹枪显示所有弹丸轨迹，其他武器只显示第一个）
                if (!isShotgun && p > 0) {
                    // 非霰弹枪只显示第一发
                } else {
                    createBulletTrail(rayOrigin, endPoint);
                }

                if (intersects.length > 0) {
                    const hit = intersects[0];
                    let isTargetHit = false;

                    // 检查是否击中靶子
                    for (const target of targets) {
                        if (target.userData.hitBoxes) {
                            for (const hb of target.userData.hitBoxes) {
                                if (hb.mesh === hit.object || (hb.mesh.parent && hb.mesh.parent === hit.object)) {
                                    isTargetHit = true;
                                    anyTargetHit = true;

                                    // 霰弹枪每发弹丸伤害较低，传递pelletMultiplier用于伤害缩放
                                    // 其他武器正常计算
                                    const pelletMultiplier = isShotgun ? (1 / pelletCount) : 1;
                                    hitTarget(target, hit.point, hb.multiplier * pelletMultiplier, hb.part, pelletMultiplier);
                                    break;
                                }
                            }
                            if (isTargetHit) break;
                        }
                    }

                    // 记录第一个击中点用于墙体效果
                    if (!isTargetHit && firstHitPoint === null) {
                        firstHitPoint = hit.point;
                        firstHitNormal = hit.face ? hit.face.normal : undefined;
                    }
                }
            }

            // 如果没有击中任何靶子，在第一个击中点创建墙体效果
            if (!anyTargetHit && firstHitPoint !== null) {
                createWallImpact(firstHitPoint, firstHitNormal);
                createWallDecal(firstHitPoint, firstHitNormal);
            }

            applyRecoil();
        }

        function getFarPoint() {
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            return camera.getWorldPosition(new THREE.Vector3()).add(dir.multiplyScalar(100));
        }

        function showMuzzleFlash() {
            muzzleFlash.material.opacity = 1;
            muzzleFlash.scale.setScalar(1);
            setTimeout(() => {
                muzzleFlash.material.opacity = 0;
            }, 50);
        }

        // 增强的弹道轨迹 - 更明显且持续时间更长
        function createBulletTrail(start, end) {
            const trailGeo = new THREE.BufferGeometry();
            const positions = new Float32Array([start.x, start.y, start.z, end.x, end.y, end.z]);
            trailGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // 更明显的轨迹：增加宽度和亮度
            const trailMat = new THREE.LineBasicMaterial({
                color: 0xffff00,
                transparent: true,
                opacity: 0.9, // 增加不透明度
                linewidth: 4  // 增加线宽
            });
            const trail = new THREE.Line(trailGeo, trailMat);
            scene.add(trail);

            // 增强的撞击特效
            const impactGeo = new THREE.SphereGeometry(0.2, 12, 12); // 增大尺寸
            const impactMat = new THREE.MeshBasicMaterial({
                color: 0xffaa00,
                transparent: true,
                opacity: 1
            });
            const impact = new THREE.Mesh(impactGeo, impactMat);
            impact.position.copy(end);
            scene.add(impact);

            createImpactParticles(end);

            // 延长轨迹持续时间：从0.05增加到0.3秒
            let opacity = 1;
            const fadeTrail = () => {
                opacity -= 0.003; // 减慢淡出速度
                trailMat.opacity = opacity;
                impactMat.opacity = opacity;
                impact.scale.multiplyScalar(1.005); // 非常慢的缩放
                if (opacity > 0) requestAnimationFrame(fadeTrail);
                else {
                    scene.remove(trail);
                    scene.remove(impact);
                }
            };
            fadeTrail();
        }

        function createImpactParticles(position) {
            const count = 25; // 增加粒子数量
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = position.x;
                positions[i * 3 + 1] = position.y;
                positions[i * 3 + 2] = position.z;

                const dir = new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    Math.random() * 1.5 + 0.5,
                    (Math.random() - 0.5) * 2
                ).normalize().multiplyScalar(0.25 + Math.random() * 0.35);
                velocities.push(dir);

                const colorChoice = Math.random();
                if (colorChoice < 0.5) {
                    colors[i * 3] = 1; colors[i * 3 + 1] = 0.7; colors[i * 3 + 2] = 0;
                } else if (colorChoice < 0.75) {
                    colors[i * 3] = 1; colors[i * 3 + 1] = 0.3; colors[i * 3 + 2] = 0;
                } else {
                    colors[i * 3] = 0; colors[i * 3 + 1] = 1; colors[i * 3 + 2] = 0.5;
                }
                sizes[i] = Math.random() * 0.15 + 0.07; // 增大粒子尺寸
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 1,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);

            particles.push({
                mesh: points,
                type: 'impact',
                velocities,
                life: 1.2, // 增加粒子生命周期
                decay: 0.015
            });
        }

        function applyRecoil() {
            const recoilX = (Math.random() - 0.5) * currentWeapon.recoil.x;
            const recoilY = Math.random() * currentWeapon.recoil.y;
            camera.rotation.x -= recoilY;
            camera.rotation.z += recoilX;
            setTimeout(() => {
                camera.rotation.x += recoilY;
                camera.rotation.z -= recoilX;
            }, 50);
        }

        function hitTarget(target, hitPoint, multiplier, hitPart, pelletMultiplier = 1) {
            const userData = target.userData;
            userData.hitFlash = 1.0;

            let basePoints = 10;
            let baseDamage = 1;
            if (hitPart === 'head') {
                basePoints = 100;
                baseDamage = 999; // 爆头必杀
            } else if (hitPart === 'torso') {
                basePoints = 30;
                baseDamage = currentWeapon.id === 'sniper' ? 999 : 1; // 狙击枪躯干击中必杀
            } else {
                basePoints = 15;
                baseDamage = 1;
            }

            // 应用武器伤害倍率和难度分数倍率
            const diffSettings = gameState.difficultySettings[gameState.difficulty] || gameState.difficultySettings.normal;
            const points = Math.round(basePoints * multiplier * currentWeapon.damageMultiplier * diffSettings.scoreMultiplier);
            gameState.score += points;
            updateScoreUI();

            // 霰弹枪每颗弹丸伤害更低，通过pelletMultiplier缩放
            // 狙击枪开镜/爆头/躯干直接秒杀
            userData.health -= baseDamage * pelletMultiplier;

            createHitMarker(hitPoint, points, hitPart);

            if (userData.health <= 0) {
                destroyTarget(target);
            }
        }

        function createHitMarker(position, points, hitPart) {
            const canvas = document.createElement('canvas');
            canvas.width = 160;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 32px Arial';
            ctx.fillStyle = hitPart === 'head' ? '#ff0066' : (points >= 30 ? '#00ff88' : '#ffff00');
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.textAlign = 'center';
            const text = hitPart === 'head' ? `爆头! +${points}` : `+${points}`;
            ctx.strokeText(text, 80, 40);
            ctx.fillText(text, 80, 40);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false
            });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.copy(position);
            sprite.scale.set(2.5, 1, 1);
            scene.add(sprite);

            let life = 1.0;
            const animate = () => {
                life -= 0.02;
                sprite.position.y += 0.05;
                sprite.material.opacity = life;
                sprite.scale.multiplyScalar(1.02);
                if (life > 0) requestAnimationFrame(animate);
                else {
                    scene.remove(sprite);
                    texture.dispose();
                }
            };
            animate();
        }

        function destroyTarget(target) {
            createTargetExplosion(target.position.clone());

            scene.remove(target);
            const idx = targets.indexOf(target);
            if (idx > -1) targets.splice(idx, 1);

            gameState.targetsLeft--;
            updateTargetCount();

            gameState.score += 200;
            updateScoreUI();

            if (targets.length < 10 && !gameState.isGameOver) {
                setTimeout(() => createTarget(), 2000 + Math.random() * 3000);
            }

            checkWinCondition();
        }

        function createTargetExplosion(position) {
            const count = 75; // 增加爆炸粒子数量
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = position.x;
                positions[i * 3 + 1] = position.y;
                positions[i * 3 + 2] = position.z;

                const dir = new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    Math.random() * 1.5 + 0.5,
                    (Math.random() - 0.5) * 2
                ).normalize().multiplyScalar(0.35 + Math.random() * 0.55);
                velocities.push(dir);

                const r = Math.random();
                if (r < 0.4) { colors[i*3]=1; colors[i*3+1]=0.2; colors[i*3+2]=0; }
                else if (r < 0.7) { colors[i*3]=1; colors[i*3+1]=0.6; colors[i*3+2]=0; }
                else { colors[i*3]=0; colors[i*3+1]=1; colors[i*3+2]=0.3; }
                sizes[i] = Math.random() * 0.25 + 0.15; // 增大粒子尺寸
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.25,
                vertexColors: true,
                transparent: true,
                opacity: 1,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);

            particles.push({
                mesh: points,
                type: 'explosion',
                velocities,
                life: 1.8, // 增加爆炸粒子生命周期
                decay: 0.012
            });
        }

        function checkWinCondition() {
            if (gameState.targetsLeft <= 0 && targets.length === 0) {
                gameWin();
            }
        }

        function gameWin() {
            gameState.isGameOver = true;
            controls.unlock();
            document.getElementById('final-score-value').textContent = gameState.score;
            document.getElementById('game-over').querySelector('h1').textContent = '胜利!';
            document.getElementById('game-over').querySelector('h1').style.color = '#00ff88';
            document.getElementById('game-over').style.display = 'block';
        }

        function gameOver() {
            gameState.isGameOver = true;
            controls.unlock();
            document.getElementById('final-score-value').textContent = gameState.score;
            document.getElementById('game-over').querySelector('h1').textContent = '游戏结束';
            document.getElementById('game-over').querySelector('h1').style.color = '#ff3333';
            document.getElementById('game-over').style.display = 'block';
        }

        function reload() {
            if (gameState.isReloading || gameState.ammo === gameState.maxAmmo) return;
            gameState.isReloading = true;
            gameState.reloadStartTime = Date.now();

            const reloadBarContainer = document.getElementById('reload-bar-container');
            const reloadBar = document.getElementById('reload-bar');
            const reloadText = document.getElementById('reload-text');

            reloadBarContainer.style.display = 'block';
            reloadText.style.display = 'block';
            reloadBar.style.width = '0%';

            const animateReload = () => {
                if (!gameState.isReloading) return;
                const elapsed = Date.now() - gameState.reloadStartTime;
                const progress = Math.min(elapsed / gameState.reloadTime, 1);
                reloadBar.style.width = (progress * 100) + '%';
                if (progress < 1) {
                    requestAnimationFrame(animateReload);
                }
            };
            animateReload();

            setTimeout(() => {
                gameState.ammo = gameState.maxAmmo;
                weaponAmmo[currentWeaponIndex] = gameState.ammo;
                gameState.isReloading = false;
                reloadBarContainer.style.display = 'none';
                reloadText.style.display = 'none';
                updateAmmoUI();
                updateWeaponHUD();
            }, gameState.reloadTime);
        }

        // 移动逻辑
        function updateMovement(delta) {
            if (gameState.isPaused || gameState.isGameOver || !controls.isLocked) return;

            const speed = gameState.moveSpeed * (gameState.isSprinting ? gameState.sprintMultiplier : 1);
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            const move = new THREE.Vector3();
            if (keys.w) move.add(forward);
            if (keys.s) move.sub(forward);
            if (keys.a) move.sub(right);
            if (keys.d) move.add(right);

            // 检测是否在移动
            isMoving = move.length() > 0;
            moveVelocity.lerp(move, 0.1);

            if (isMoving) {
                move.normalize().multiplyScalar(speed);

                const newPos = playerBody.position.clone().add(move);
                if (checkCollision(newPos)) {
                    const tryX = playerBody.position.clone();
                    tryX.x = newPos.x;
                    if (!checkCollision(tryX)) {
                        playerBody.position.x = newPos.x;
                        camera.position.x = newPos.x;
                    } else {
                        const tryZ = playerBody.position.clone();
                        tryZ.z = newPos.z;
                        if (!checkCollision(tryZ)) {
                            playerBody.position.z = newPos.z;
                            camera.position.z = newPos.z;
                        }
                    }
                } else {
                    playerBody.position.add(move);
                    camera.position.x = playerBody.position.x;
                    camera.position.z = playerBody.position.z;
                }

                const bobSpeed = gameState.isSprinting ? 0.015 : 0.01;
                const bobAmount = Math.sin(Date.now() * bobSpeed) * 0.02 * (gameState.isSprinting ? 2 : 1);
                camera.position.y = playerBody.position.y + bobAmount;
            }
        }

        function checkCollision(position) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(
                position,
                new THREE.Vector3(0.8, 1.8, 0.8)
            );

            for (const obs of obstacles) {
                const obsBox = new THREE.Box3().setFromObject(obs);
                if (playerBox.intersectsBox(obsBox)) return true;
            }

            if (position.x < -95 || position.x > 95 || position.z < -95 || position.z > 95) {
                return true;
            }

            return false;
        }

        // 更新靶子
        function updateTargets(delta) {
            targets.forEach(target => {
                const data = target.userData;
                const m = data.moveData;

                if (m.type === 0) {
                    m.angle += m.speed * delta;
                    target.position.x = m.center.x + Math.cos(m.angle) * m.radius;
                    target.position.z = m.center.z + Math.sin(m.angle) * m.radius;
                    target.position.y = m.originalY + Math.sin(m.angle * 2 + m.verticalPhase) * 0.5;
                } else if (m.type === 1) {
                    m.angle += m.speed * delta;
                    target.position.x = m.center.x + Math.sin(m.angle) * m.radius;
                    target.position.z = m.center.z + Math.sin(m.angle * 2) * m.radius * 0.5;
                    target.position.y = m.originalY + Math.cos(m.angle * 1.5 + m.verticalPhase) * m.verticalRange * 0.5;
                } else {
                    m.angle += m.speed * delta;
                    const t = Math.sin(m.angle);
                    target.position.x = m.center.x + t * m.radius;
                    target.position.z = m.center.z + Math.cos(m.angle * 0.7) * m.radius * 0.7;
                    target.position.y = m.originalY + Math.sin(m.angle * 3 + m.verticalPhase) * 0.3;
                }

                target.lookAt(camera.position.x, target.position.y, camera.position.z);
                target.rotation.x = 0;
                target.rotation.z = 0;

                updateHitBoxes(target);

                if (data.hitFlash > 0) {
                    data.hitFlash -= delta * 5;
                    target.traverse(child => {
                        if (child.isMesh && child.material.emissive !== undefined) {
                            child.material.emissive = new THREE.Color(1, 0, 0);
                            child.material.emissiveIntensity = data.hitFlash;
                        }
                    });
                } else {
                    target.traverse(child => {
                        if (child.isMesh && child.material.emissive !== undefined) {
                            child.material.emissiveIntensity = 0;
                        }
                    });
                }
            });
        }

        // 更新粒子和弹孔贴花
        function updateParticles(delta) {
            // 更新普通粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];

                if (p.type === 'ambient') {
                    const positions = p.mesh.geometry.attributes.position.array;
                    for (let j = 0; j < positions.length; j += 3) {
                        positions[j + 1] += Math.sin(Date.now() * 0.001 + j) * 0.001;
                        if (positions[j + 1] > 25) positions[j + 1] = 0;
                    }
                    p.mesh.geometry.attributes.position.needsUpdate = true;
                } else if (p.type === 'light') {
                    const angle = Date.now() * 0.0005 * p.speed;
                    p.mesh.position.x = p.originalPos.x + Math.cos(angle) * 15;
                    p.mesh.position.z = p.originalPos.z + Math.sin(angle) * 15;
                    p.mesh.position.y = p.originalPos.y + Math.sin(angle * 2) * 3;
                } else if (p.type === 'impact' || p.type === 'explosion' || p.type === 'wallImpact') {
                    const positions = p.mesh.geometry.attributes.position.array;
                    const sizes = p.mesh.geometry.attributes.size.array;

                    for (let j = 0; j < p.velocities.length; j++) {
                        const v = p.velocities[j];
                        v.y -= 0.008 * (60 * delta);
                        positions[j * 3] += v.x * (60 * delta);
                        positions[j * 3 + 1] += v.y * (60 * delta);
                        positions[j * 3 + 2] += v.z * (60 * delta);
                        sizes[j] *= 0.98;
                    }

                    p.mesh.geometry.attributes.position.needsUpdate = true;
                    p.mesh.geometry.attributes.size.needsUpdate = true;
                    p.mesh.material.opacity = p.life;
                    p.life -= p.decay * (60 * delta);

                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        p.mesh.geometry.dispose();
                        p.mesh.material.dispose();
                        particles.splice(i, 1);
                    }
                }
            }

            // 更新弹孔贴花 - 移除超过寿命的弹孔
            const now = Date.now();
            for (let i = bulletDecals.length - 1; i >= 0; i--) {
                const decal = bulletDecals[i];
                const age = now - decal.createdTime;

                if (age > decal.lifetime) {
                    // 超过寿命，移除弹孔
                    scene.remove(decal.mesh);
                    decal.mesh.geometry.dispose();
                    decal.mesh.material.dispose();
                    bulletDecals.splice(i, 1);
                }
                // 可选：淡出效果
                else {
                    const fadeRatio = 1 - (age / decal.lifetime);
                    decal.mesh.material.opacity = 0.9 * fadeRatio;
                }
            }
        }

        // UI 更新
        function updateScoreUI() {
            document.getElementById('score-value').textContent = gameState.score;
        }

        function updateAmmoUI() {
            document.getElementById('ammo-value').textContent = gameState.ammo;
            document.getElementById('max-ammo').textContent = gameState.maxAmmo;
        }

        function updateTargetCount() {
            document.getElementById('targets-left').textContent = targets.length;
        }

        function updateHealthUI() {
            document.getElementById('health-value').textContent = Math.max(0, gameState.health);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function restartGame() {
            gameState.score = 0;
            gameState.health = 100;
            gameState.targetsLeft = 10;
            gameState.isGameOver = false;
            gameState.isPaused = false;
            gameState.isReloading = false;
            gameState.isSprinting = false;
            gameState.isADS = false;
            gameState.isFiring = false;
            gameState.currentFOV = gameState.normalFOV;
            camera.fov = gameState.normalFOV;
            camera.updateProjectionMatrix();
            updateSprintIndicator();

            // 重置武器状态
            currentWeaponIndex = 0;
            currentWeapon = WEAPONS[0];
            weaponAmmo = WEAPONS.map(w => w.maxAmmo);
            gameState.fireRate = currentWeapon.fireRate;
            gameState.reloadTime = currentWeapon.reloadTime;
            gameState.maxAmmo = currentWeapon.maxAmmo;
            gameState.ammo = weaponAmmo[0];
            crosshairState.baseSpread = currentWeapon.spread.base;
            crosshairState.moveSpread = currentWeapon.spread.move;
            crosshairState.sprintSpread = currentWeapon.spread.sprint;
            crosshairState.targetSpread = currentWeapon.spread.base;

            // 重置武器模型可见性
            weaponGroups.forEach((group, index) => {
                group.visible = (index === 0);
            });
            muzzleFlash = muzzleFlashes[0];

            targets.forEach(t => scene.remove(t));
            targets = [];

            particles.forEach(p => {
                if (p.mesh && p.mesh.geometry) p.mesh.geometry.dispose();
                if (p.mesh && p.mesh.material) p.mesh.material.dispose();
                if (p.mesh) scene.remove(p.mesh);
            });
            particles = [];

            // 清除所有弹孔贴花
            bulletDecals.forEach(decal => {
                scene.remove(decal.mesh);
                decal.mesh.geometry.dispose();
                decal.mesh.material.dispose();
            });
            bulletDecals = [];

            playerBody.position.set(0, 1.6, 0);
            camera.position.set(0, 1.6, 0);
            camera.rotation.set(0, 0, 0);

            setupTargets();

            updateScoreUI();
            updateAmmoUI();
            updateHealthUI();
            updateTargetCount();
            updateWeaponHUD();

            document.getElementById('game-over').style.display = 'none';
            document.getElementById('reload-bar-container').style.display = 'none';
            document.getElementById('reload-text').style.display = 'none';
            // 重新开始时显示难度选择菜单
            showDifficultyMenu();
        }

        // 主循环
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const now = Date.now();

            if (!gameState.isPaused && !gameState.isGameOver) {
                updateMovement(delta);
                updateTargets(delta);

                // 连发逻辑：步枪和冲锋枪按住左键持续射击
                if (gameState.isFiring && (currentWeapon.id === 'rifle' || currentWeapon.id === 'smg')) {
                    if (now - gameState.lastShot >= gameState.fireRate) {
                        shoot();
                    }
                }
            }
            updateParticles(delta);
            drawCrosshair(delta);

            renderer.render(scene, camera);
        }

        init().catch(console.error);
    </script>
</body>
</html>
